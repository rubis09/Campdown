<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campdown</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #021029;
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        /* Countdown box fills screen with 25px gap */
        #countdown1 {
            background-color: #6A7B8C;
            width: calc(100vw - 50px);
            height: calc(100vh - 50px);
            margin: 25px auto;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }
        #timer {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
        }
        #date1 {
            font-size: 1.2em;
            margin-top: 10px;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.5em; }
            h2 { font-size: 1.2em; }
            #timer { font-size: 1.5em; }
            #date1 { font-size: 1em; }
        }
    </style>
</head>
<body>

<h1>Campdown</h1>
<h2>2026 Countdown</h2>

<div id="countdown1">
    <div id="timer"></div>
    <p id="date1"></p>
</div>

<script>
    const countDownDate1 = new Date("January 1, 2026 00:00:00 GMT+0100").getTime();

    function startCountdown(targetDate, timerId, dateTextId) {
        const intervalId = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById(timerId).innerHTML =
                days + " dager " + hours + " timer " + minutes + " minutter " + seconds + " sekunder ";

            const targetDateObj = new Date(targetDate);
            document.getElementById(dateTextId).innerHTML =
                targetDateObj.toLocaleDateString('no-NO', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

            if (distance < 0) {
                clearInterval(intervalId);
                document.getElementById(timerId).innerHTML = "Event is here!";
                document.getElementById(dateTextId).innerHTML = "";
            }
        }, 1000);
    }

    startCountdown(countDownDate1, "timer", "date1");
</script>

</body>
</html>
