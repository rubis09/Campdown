<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Campdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #12160d;
            color: white;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .countdown-container {
            margin-bottom: 30px;
        }
        .countdown {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            margin: 10px auto;
            max-width: 300px;
        }
        .date-text {
            font-size: 1em;
            margin-top: 5px;
        }
        .info-text {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<h1>Campdown</h1>
<div id="countdowns"></div>

<div class="info-text">
    Telegram Bot: <a href="http://telegram.me/Campdownbot" style="color: #ea791b;">Click here</a>
</div>

<script>
    async function loadCountdowns() {
        const res = await fetch('dates.txt');
        const text = await res.text();
        const groups = text.trim().split('-').map(g => g.trim()).filter(Boolean);
        const container = document.getElementById('countdowns');

        groups.forEach((group, index) => {
            const lines = group.split('\n').map(l => l.trim()).filter(Boolean);
            const entries = [];

            for (let i = 0; i < lines.length; i += 3) {
                const name = lines[i];
                const date = new Date(lines[i + 1]);
                const color = lines[i + 2];
                if (!isNaN(date)) {
                    entries.push({ name, date, color });
                }
            }

            // Find next upcoming entry
            const now = new Date();
            const next = entries.filter(e => e.date > now).sort((a, b) => a.date - b.date)[0];
            if (!next) return;

            // Create DOM
            const div = document.createElement('div');
            div.className = 'countdown-container';
            div.innerHTML = `
                <h2>${next.name}</h2>
                <div class="countdown" id="countdown${index}" style="background-color: ${next.color}"></div>
                <p class="date-text" id="date${index}"></p>
            `;
            container.appendChild(div);

            startCountdown(next.date, `countdown${index}`, `date${index}`);
        });
    }
