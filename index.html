<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campdown</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #021029;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 100vh; /* hele skjermen */
            box-sizing: border-box;
        }
        h1 {
            font-size: 3vw;
            margin: 0 0 10px 0;
        }
        h2 {
            font-size: 2.5vw;
            margin: 0 0 20px 0;
        }
        /* Countdown box fyller resten av skjermen */
        #countdown1 {
            flex: 1; /* tar all ledig plass under titlene */
            margin: 0 25px 0 25px; /* 25px gap på sidene */
            background-color: #6A7B8C;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #timer {
            font-size: 4vw;
            font-weight: bold;
            margin: 20px 0;
        }
        #date1 {
            font-size: 2vw;
            margin-top: 10px;
        }
        @media (max-width: 480px) {
            h1 { font-size: 6vw; }
            h2 { font-size: 5vw; }
            #timer { font-size: 8vw; }
            #date1 { font-size: 4vw; }
        }
    </style>
</head>
<body>

    <h1>Campdown</h1>
    <h2>2026 Countdown</h2>

    <div id="countdown1">
        <div id="timer"></div>
        <p id="date1"></p>
    </div>

    <script>
        const countDownDate1 = new Date("January 1, 2026 00:00:00 GMT+0100").getTime();

        function startCountdown(targetDate, timerId, dateTextId) {
            const intervalId = setInterval(function() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById(timerId).innerHTML =
                    days + " dager " + hours + " timer " + minutes + " minutter " + seconds + " sekunder ";

                const targetDateObj = new Date(targetDate);
                document.getElementById(dateTextId).innerHTML =
                    targetDateObj.toLocaleDateString('no-NO', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                if (distance < 0) {
                    clearInterval(intervalId);
                    document.getElementById(timerId).innerHTML = "Event is here!";
                    document.getElementById(dateTextId).innerHTML = "";
                }
            }, 1000);
        }

        startCountdown(countDownDate1, "timer", "date1");
    </script>

</body>
</html>
