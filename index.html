<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Campdown</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #12160d;
      color: white;
      margin: 0; /* remove default margins */
      height: 100vh; /* full viewport height */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 3em; /* bigger title */
      margin-bottom: 20px;
    }

    .countdown-container {
      width: calc(100% - 40px); /* full width minus 20px border each side */
      height: calc(100% - 40px); /* full height minus 20px border each side */
      border: 20px solid #fff; /* white border */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .countdown {
      font-size: 3em; /* much bigger countdown text */
      font-weight: bold;
      padding: 20px;
      border-radius: 10px;
      margin: 20px auto;
      width: 100%;
      text-align: center;
      color: white;
    }

    .date-text {
      font-size: 1.5em; /* larger date text */
      margin-top: 10px;
    }

    .info-text {
      margin-top: 30px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Campdown</h1>
  <div id="countdowns"></div>
  <div class="info-text">
    Telegram Bot: <a href="http://telegram.me/Campdownbot" style="color: #ea791b;">Click here</a>
  </div>

  <script>
    async function loadCountdowns() {
      try {
        const res = await fetch('./dates.txt');
        if (!res.ok) throw new Error(`Failed to fetch dates.txt: ${res.status}`);
        const text = await res.text();

        const groups = text.trim().split(/\r?\n-\r?\n/).map(g => g.trim()).filter(Boolean);
        const container = document.getElementById('countdowns');

        groups.forEach((group, index) => {
          const lines = group.split('\n').map(l => l.trim()).filter(Boolean);
          const entries = [];

          for (let i = 0; i < lines.length; i += 3) {
            const name = lines[i];
            const date = new Date(lines[i + 1]);
            const color = lines[i + 2];
            if (!isNaN(date)) {
              entries.push({ name, date, color });
            } else {
              console.error(`Invalid date for "${name}": ${lines[i + 1]}`);
            }
          }

          const now = new Date();
          const upcoming = entries.filter(e => e.date > now).sort((a, b) => a.date - b.date);
          if (!upcoming.length) {
            console.warn(`No upcoming events for group #${index + 1}`);
            return;
          }
          const next = upcoming[0];

          const div = document.createElement('div');
          div.className = 'countdown-container';
          div.innerHTML = `
            <h2>${next.name}</h2>
            <div class="countdown" id="countdown${index}" style="background-color: ${next.color};"></div>
            <p class="date-text" id="date${index}"></p>
          `;
          container.appendChild(div);

          startCountdown(next.date, `countdown${index}`, `date${index}`);
        });
      } catch (err) {
        console.error('Error loading countdowns:', err);
      }
    }

    function startCountdown(targetDate, elementId, dateTextId) {
      const interval = setInterval(() => {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance <= 0) {
          clearInterval(interval);
          document.getElementById(elementId).innerText = "Happy New Year!";
          document.getElementById(dateTextId).innerText = "2026";
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById(elementId).innerText =
          `${days} dager ${hours} timer ${minutes} minutter ${seconds} sekunder`;

        document.getElementById(dateTextId).innerText =
          targetDate.toLocaleString('no-NO');
      }, 1000);
    }

    window.addEventListener("DOMContentLoaded", loadCountdowns);
  </script>
</body>
</html>
